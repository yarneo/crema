[project]
name = "decent-advisor"
version = "0.1.0"
description = "Local espresso advisor server for the Decent DE1 — receives shots from the tablet skin, asks Claude for dial-in advice, returns grind/profile suggestions"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv]
package = false
