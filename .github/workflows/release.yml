name: Build Crema release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build and test Decaid skin
        working-directory: web
        run: |
          npm ci
          npm test
          npm run release:zip

      - name: Build classic tablet skin
        run: ./build.sh

      - name: Publish both installable skins
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Crema.zip
            web/Crema-Decaid.zip
