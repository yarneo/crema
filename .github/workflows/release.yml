name: Build Crema release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build and test Decaid skin
        working-directory: web
        run: |
          npm ci
          npm test
          npm run release:zip

      - name: Build classic tablet skin
        run: ./build.sh

      # The release notes are the tag's own annotation, so what you write in
      # `git tag -a` is what people read on the release page. Without this the
      # action generates a bare commit list and the changelog never ships.
      - name: Release notes from the tag annotation
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --force --tags --depth=1
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > /tmp/notes.md
          cat /tmp/notes.md

      - name: Publish both installable skins
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/notes.md
          generate_release_notes: true
          files: |
            dist/Crema.zip
            web/Crema-Decaid.zip
